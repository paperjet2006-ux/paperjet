<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PaperJet">
  <!-- The mark: a sheet of paper folded into a dart. The fold line is the whole
       idea — it is what separates a paper plane from a generic "send" arrow,
       and it is the last thing to survive at 16px, so it is drawn as a solid
       shape rather than a hairline stroke that would disappear.

       Sized and weighted for the favicon rather than the hero: the dart sits
       in from the tile edge, and the two faces are far enough apart in value
       that the fold still reads at 16px, where a subtler split just greyed
       into one blob. -->
  <defs>
    <linearGradient id="pjTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="17" fill="url(#pjTile)"/>

  <!-- Upper wing — the lit face of the dart. -->
  <path d="M49.6 15.3 L14.4 30.7 L27.2 35.7 Z" fill="#fff"/>
  <!-- Lower body — the shaded side beyond the fold, so the mark reads as
       folded paper rather than a flat triangle. -->
  <path d="M49.6 15.3 L27.2 35.7 L29.9 48.7 L35.9 40.1 Z" fill="#fff" fill-opacity=".58"/>
</svg>
